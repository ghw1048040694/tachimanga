name: Extract APK signing fingerprints

on:
  push:
    paths:
      - '.github/workflows/extract-apk-signing-fingerprint.yml'
  workflow_dispatch:

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnose APK signatures
        shell: bash
        run: |
          set -u
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          echo "Using: $APKSIGNER"
          count=0
          for apk in repo/apk/*.apk; do
            echo "===== $(basename "$apk") ====="
            "$APKSIGNER" verify --verbose --print-certs "$apk" 2>&1 || true
            echo "-- META-INF signature entries --"
            unzip -l "$apk" 2>/dev/null | grep -Ei 'META-INF/.*\.(RSA|DSA|EC|SF)$' || true
            echo "-- keytool --"
            keytool -printcert -jarfile "$apk" 2>&1 || true
            count=$((count + 1))
            if [ "$count" -ge 5 ]; then
              break
            fi
          done
