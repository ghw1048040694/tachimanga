name: Extract APK signing fingerprints

on:
  push:
    paths:
      - '.github/workflows/extract-apk-signing-fingerprint.yml'
  workflow_dispatch:

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Summarize APK signing fingerprints
        shell: bash
        run: |
          set -u
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          echo "Using: $APKSIGNER"
          : > fingerprints.tsv
          for apk in repo/apk/*.apk; do
            name="$(basename "$apk")"
            output="$($APKSIGNER verify --print-certs "$apk" 2>&1 || true)"
            fp="$(printf '%s\n' "$output" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)"
            if [ -n "$fp" ]; then
              printf '%s\t%s\n' "$name" "$fp" | tee -a fingerprints.tsv
            else
              printf '%s\tUNSIGNED_OR_UNVERIFIABLE\n' "$name" | tee -a fingerprints.tsv
            fi
          done
          echo "===== SUMMARY ====="
          cut -f2 fingerprints.tsv | sort | uniq -c | sort -nr
